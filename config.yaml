
# Optional display settings (useful on Raspberry Pi)
# screen_w/screen_h: set your display resolution to allow accurate fullscreen 'cover' scaling
screen_w: 1024
screen_h: 600
# If python-vlc is installed, MediaManager will use it by default (can be disabled)
use_vlc: true
# External sentinel filename to stop VLC playback (create this file to stop playback)
stop_file: stop_media

camera_index: 0
frame_rate: 12
downscale_width: 320

detection_method: frame_diff

presence:
  min_area: 800
  linger_seconds: 3.0

wave:
  min_magnitude: 4.0
  min_oscillations: 2
  history_seconds: 1.0

clips:
  presence: assets/presence.mp4
  linger: assets/linger.mp4
  wave: assets/wave.mp4

base_image: assets/baseimg.jpg

cooldowns:
  presence: 9.0
  linger: 15.0
  wave: 3.0

log_level: INFO
